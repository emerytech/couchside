name: CI

# Fast, minimal gate for the box agent. Two jobs:
#   compile — cross-platform py_compile syntax check of every agent entrypoint,
#             including the Windows agent (py_compile is syntax-only, so it is a
#             valid gate on ubuntu; a real windows-latest smoke build is a
#             future add — see the note in the job below).
#   smoke   — boot couchsided.py headless in --mock mode on a spare port and hit
#             a real authed endpoint to prove it serves + auth still works.

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # py_compile is a pure-syntax check and is cross-platform: compiling the
      # Windows agent here on ubuntu catches syntax regressions without a Windows
      # runner. Task 27: a genuine windows-latest build/import of couchsided-win.py
      # (pywin32 / ViGEmBus deps, tray widget) is a FUTURE add and intentionally
      # not gated here so CI stays fast and free of Windows-only dependencies.
      - name: py_compile agent entrypoints
        run: |
          python3 -m py_compile \
            agent/couchsided.py \
            agent/win/couchsided-win.py \
            agent/qr.py
          echo "py_compile OK"

      # The guide-hold trigger fires a SESSION SWITCH, which tears down the
      # user's desktop and any unsaved work. Its two dangerous failure modes —
      # firing on a tap, and matching the agent's OWN emulated pad (created on
      # every phone connect) — are invisible to the --mock smoke test below and
      # otherwise need real hardware plus a controller to catch. Pure stdlib, no
      # pytest, runs in well under a second.
      - name: Unit tests (guide-hold trigger)
        run: python3 tests/test_guide_hold.py

      # Gamepad handoff lifecycle: a re-promoted session must REUSE its virtual
      # pad. The old always-create path orphaned a pad per Pass/take-back cycle
      # (fd left open -> phantom controller until the agent exits), and the
      # resulting churn corrupted a real box's Steam desktop controller config.
      - name: Unit tests (gamepad handoff)
        run: python3 tests/test_gamepad_handoff.py

      # Box-driven keepalive: the app's own {"t":"ping"} rides a JS setInterval
      # that iOS FREEZES when the app idles, so the phone sat mute on a live
      # socket and got idle-reaped at 12s -- dead trackpad, "controller
      # disconnected", endless reconnect churn. The box now PINGs every session;
      # the phone OS auto-PONGs below the JS layer, keeping the holder alive.
      # If the tick ever stops pinging every session, that churn is back.
      - name: Unit tests (gamepad keepalive)
        run: python3 tests/test_gamepad_keepalive.py

      # The d-pad is a LATCHED absolute axis (DPAD_MAP -> ABS_HAT0X/Y), not an
      # edge-triggered key, and nothing re-zeroes it: no stuck-button watchdog,
      # and the 12s idle reap never fires while the app pings every 5s. ONE
      # missing release therefore pins the axis and Steam auto-repeats it
      # forever -- the "swipe sticks and keeps going that direction" bug.
      # _release_devices() destroyed a demoted pad without zeroing it, while
      # carefully zeroing the mouse two lines below.
      - name: Unit tests (dpad latch)
        run: python3 tests/test_dpad_latch.py

      # Couch Mode ceremony: the staged desktop->TV switch. Its whole reason for
      # existing is to stop two lies (a fake-green "Ready" that didn't verify
      # Game Mode came up, and audio that silently "skipped" onto the wrong
      # device). These drive the real worker with env I/O stubbed.
      - name: Unit tests (couch ceremony)
        run: python3 tests/test_couch_ceremony.py

      # Leaving Couch Mode used to GUESS its way back, picking whichever sink had
      # "speaker"/"analog"/"pci" in its name and making that the system default.
      # That is a substitution, not a restore, and it cost a user their audio.
      # These pin the rule: put audio back exactly where it was, or leave it
      # alone -- never pick a device the user did not choose.
      - name: Unit tests (audio sink restore)
        run: python3 tests/test_audio_sink_restore.py

      # Audio OUTPUT switcher (GET /api/audio, POST /api/audio/default). The one
      # that matters is the allowlist: the sink a client names is looked up in the
      # set pactl itself reported and refused otherwise, reaching subprocess only
      # as a single argv element. Proves an unknown/empty/injection name runs
      # nothing, and that the --mock switch is observable (default moves).
      - name: Unit tests (audio output switcher)
        run: python3 tests/test_audio_switch.py

      # Front light-bar / status-LED control (GET /api/leds, POST /api/leds/set).
      # The one that matters is the allowlist: the LED a client names is looked up
      # in the live os.listdir(/sys/class/leds) set and must be writable, else
      # NOTHING is written; attribute paths are fixed literals; trigger is only
      # ever 'none'. Proves unknown/traversal/non-writable ids write nothing,
      # colour is written in the device's own channel order, and the --mock switch
      # is observable.
      - name: Unit tests (led control)
        run: python3 tests/test_led_control.py

      # LED effect engine + persistence (POST /api/leds/effect, the effects/active
      # fields on GET /api/leds, reboot restore). Proves an unknown effect id or an
      # unknown/traversal/non-writable LED starts + writes NOTHING, that the render
      # thread only ever writes the three fixed-literal attrs, that persistence
      # round-trips and is REVALIDATED on restore, and that --mock is observable.
      - name: Unit tests (led effects)
        run: python3 tests/test_led_effects.py

      # OpenRGB backend (GET /api/openrgb, POST /api/openrgb/set) + the hand-rolled
      # SDK client. No OpenRGB hardware in CI, so the wire format is proven against
      # an in-process mock OpenRGB server (handshake, controller-data parse, per-LED
      # UPDATE_LEDS frames). Proves an out-of-range device index or unknown effect
      # writes NOTHING, colours round-trip, and --mock is observable.
      - name: Unit tests (openrgb)
        run: python3 tests/test_openrgb.py

      # Addressable LED strip + hardware effects (valve-leds). The allowlist one:
      # the client sends a strip PREFIX, members come from the live listdir, and
      # the `effect` VALUE written must be one the device itself publishes in
      # effect_index. Proves an unknown prefix writes nothing, an unpublished
      # firmware effect is never written, and only fixed-literal attrs on the
      # strip's own members are touched.
      - name: Unit tests (led strip)
        run: python3 tests/test_led_strip.py

      # Which filesystems the dashboard reports. A Deck owner was shown
      # "3.5 / 5.0 GB, 69%" because read_disks() only looked at "/" -- which on
      # SteamOS is a small READ-ONLY rootfs -- and never mentioned /home. Asserts
      # both directions of the read-only rule, and that one filesystem reached by
      # two paths is one row rather than two identical ones.
      - name: Unit tests (disk mounts)
        run: python3 tests/test_disk_mounts.py

      # CPU temperature sensor selection (issue #449). An AMD 7800X3D board read a
      # static 16.8C forever because the reader only knew Intel's coretemp and, on
      # AMD, latched the first board/NVMe hwmon. Asserts a recognized CPU driver
      # (coretemp/k10temp/zenpower) wins over a decoy board sensor sorted before it,
      # a CPU-typed thermal zone beats a random hwmon, and both directions of #449.
      - name: Unit tests (CPU temp sensor selection)
        run: python3 tests/test_cpu_temp.py

      # USB wake sources (/api/usb-wake), read-only. Two field reports are
      # encoded here: arming only the ROOT HUBS misses controllers (their signal
      # arrives through a dongle further down the tree), and arming EVERY device
      # with a writable wakeup file causes spurious wakes (a controller powering
      # itself off is a disconnect, which the kernel counts as a wake — one
      # reporter's machine woke 15 minutes after he slept it). Fixtures are
      # verbatim off a live Bazzite box, Xbox dongle included, and one test
      # exists purely to keep the `transient` heuristic's known counterexample
      # visible rather than rediscovered by a user.
      - name: Unit tests (usb wake)
        run: python3 tests/test_usb_wake.py

      # On-screen-keyboard detection: when Steam raises its keyboard on the TV,
      # the phone raises its own. There is no general text-field-focus signal on
      # this platform, so the agent reads Steam's own UI log -- the same trick
      # stream_host_online() uses. Measured on a live Bazzite box: each open
      # emits exactly TWO lines (hence dedupe), and the NEGATIVE CONTROL matters
      # most -- navigating the library/tabs/store produced zero markers, which is
      # what makes the signal keyboard-specific rather than focus-in-general.
      # The marker is undocumented, so every path degrades closed.
      - name: Unit tests (osk watch)
        run: python3 tests/test_osk_watch.py

      # The desktop switch must honour the box's CONFIGURED session. SteamOS
      # ships both, and steamos-session-select maps the bare "plasma" arg to the
      # X11 one -- so passing it silently downgraded a Wayland-configured box to
      # X11 on every Couch Mode return. Measured on a real Deck: default was
      # plasma.desktop (Wayland), session ended up x11. Degrading CLOSED is the
      # load-bearing part: an unreadable or unlisted name must fall back to the
      # X11 pair that shipped before, so a box we cannot read is unchanged.
      - name: Unit tests (desktop session)
        run: python3 tests/test_desktop_session.py

      # Two places the agent reported success it had not verified.
      # couchmode_start() returned ok because the switch SUBPROCESS exited 0 --
      # but steamos-session-select returns as soon as the switch is TRIGGERED, so
      # a compositor that never came up produced a green result on a black TV, on
      # both the HTTP and guide-hold paths. And real_screen_frame() served
      # whatever came back: _png_complete only proves an IEND chunk exists, and
      # an all-black readback is a well-formed PNG. The inconclusive case is
      # asserted too -- a frame that CANNOT be measured must still be served, or
      # every box without magick/ffmpeg would lose its preview.
      - name: Unit tests (verified success)
        run: python3 tests/test_verified_success.py

      # Steam Remote Play discovery: parse remoteclients.vdf (streamable host
      # games) + the v29 appinfo.vdf name cache (a synthetic fixture locks the
      # binary parser), the most-recent-host de-dupe, the tool filter, and the
      # launch allowlist gate. Native in-home streaming, no Steam Link install.
      - name: Unit tests (steam link / remote play)
        run: python3 tests/test_steamlink.py

      # Non-Steam shortcuts are how EVERYTHING that is not a Steam game reaches
      # the TV on SteamOS/Bazzite. This id ends in a subprocess call, so the
      # rejection cases (non-numeric, unregistered, injection shapes) are the
      # point of the suite, not a bonus.
      - name: Unit tests (non-Steam shortcut launchers)
        run: python3 tests/test_steam_shortcuts.py

      # Per-game install size, read out of Steam's appmanifest. The number
      # drives "what is eating my disk that I never play", so a wrong one points
      # the user at the wrong game to delete — and an invented zero reads as
      # free space that is not free.
      - name: Unit tests (steam install size)
        run: python3 tests/test_steam_size.py

      # The boot-session default. The probe MUST parse steamosctl's output, not
      # its exit status: on Bazzite it prints a D-Bus UnknownInterface error and
      # exits 0, so an exit-code probe would claim the backend works on every
      # Bazzite box. The first test is that exact lie.
      - name: Unit tests (boot session default)
        run: python3 tests/test_session_default.py

      # DISKS deduping. btrfs gives every subvolume its own st_dev, so the old
      # guard listed /home and /var as two identical rows on Bazzite and
      # SteamOS — the card read as double the real storage. Fixtures are
      # verbatim /proc/self/mountinfo from a real box.
      - name: Unit tests (disk dedupe)
        run: python3 tests/test_disk_dedupe.py

      # The session-switch action you are already in must not be listed:
      # "Return to Game Mode" fired while in Game Mode rewrites the box's
      # "Boots into" preference and can restart the session under a game.
      - name: Unit tests (session action gate)
        run: python3 tests/test_session_action_gate.py

      # Display-manager detection + the greetd writer. Boot-session was
      # SDDM-only, so it silently did not exist on the custom Steam machines
      # people actually build (Arch/CachyOS + gamescope, ChimeraOS) which
      # commonly run greetd. Detection reads systemd's own
      # display-manager.service symlink. greetd has NO drop-in dir, so its
      # writer rewrites the user's single config.toml — most of these tests
      # assert it preserves every other section, or refuses.
      - name: Unit tests (display manager + greetd)
        run: python3 tests/test_display_manager.py

      # The privileged helper is the only root code we ship, reachable from a
      # local socket, so its REFUSAL surface is what gets tested: unknown verb,
      # out-of-set argument, malformed envelope, and a display manager that
      # cannot be identified — each asserting on a spawn counter, so a handler
      # that "errored" while still shelling out would fail here.
      - name: Unit tests (privileged helper verb table)
        run: python3 tests/test_privileged_helper.py

      # The macOS agent's first slice. Runs on ubuntu (probes are patched), but
      # the numbers it pins were measured on a real Mac — a first slice that had
      # only ever run in CI is what this project's rules forbid.
      - name: Unit tests (macOS agent contract + auth gate)
        run: python3 tests/test_mac_agent.py

      # SO_PEERCRED is Linux-only and the suite SKIPS elsewhere, so this step is
      # the only place it actually runs. A green local run on a Mac has not
      # tested the socket gate at all — same rule as the /proc parsers.
      - name: Unit tests (privileged helper socket auth — Linux only)
        run: python3 tests/test_helper_socket.py

      # The agent-side shim: helper present -> used; absent -> the sudo path,
      # unchanged; helper REFUSES -> final, never re-asked via sudo. That last
      # one is the behaviour a lazy shim gets wrong, and it is what keeps a
      # root-side refusal from becoming a bypass attempt.
      - name: Unit tests (helper shim in the agent)
        run: python3 tests/test_helper_shim.py

      # The opt-in remote-desktop portal module's AGENT side: the _portal_call
      # detect-and-degrade shim, the screenstream cap probe, the {t:'ma'}/{t:'mbp'}
      # absolute-pointer holder gate + closed-set allowlist, and the /ws/screen
      # auth failure + profile allowlist. Same class of surface as the input path
      # and the helper socket — a client-supplied id must be refused with nothing run.
      - name: Unit tests (remote-desktop portal module)
        run: python3 tests/test_portal_module.py

      # P4b: the H.264/WebRTC signaling relay (/ws/webrtc). Same class of surface:
      # the screenstream_h264 cap probe (honest — needs a WORKING webrtcbin), the
      # _portal_webrtc shim, the app->box SDP/ICE allowlist boundary (only
      # answer/ice/bye + known fields forward, no arbitrary client JSON reaches
      # webrtcbin), and the /ws/webrtc auth failure + profile allowlist + cap.
      - name: Unit tests (remote-desktop WebRTC relay)
        run: python3 tests/test_webrtc_relay.py

      # P4b WebCodecs tier: the H.264 Annex-B stream relay (/ws/h264). Same class
      # of surface as /ws/screen and /ws/webrtc: the _portal_stream_h264 shim, the
      # /ws/h264 auth failure + profile allowlist (a bad client ?profile becomes
      # the default, never reaches the helper) + the concurrency cap that closes
      # the socket with no portal session opened. A client id is looked up, never
      # interpolated.
      - name: Unit tests (remote-desktop H.264 stream relay)
        run: python3 tests/test_h264_stream.py

      # Portal helper stream-path fixes (a fake `gi` shim makes it importable):
      # verb_status must NOT block on _SLOCK (a pending consent held it and
      # deadlocked the agent's 2s caps probe -> caps read False -> no fluid tier),
      # and stream() must PREEMPT a different-codec encoder on a MJPEG->H.264
      # switch instead of refusing (a refusal wedged the app back on MJPEG).
      - name: Unit tests (remote-desktop portal helper logic)
        run: python3 tests/test_portal_helper_logic.py

      # TLS (P1, dark/additive): the box-side cert lifecycle. Parse degrades
      # closed (a bad tls block never enables, never raises); the mint carries the
      # real SANs (IP + .local + loopback, not the ATV DNS:couchside-only); and an
      # IP-drift re-sign REUSES the key so the SPKI pin is stable while the cert fp
      # changes — asserted in both directions, since a regression would break every
      # phone's pin on a subnet move.
      - name: Unit tests (TLS cert lifecycle)
        run: python3 tests/test_tls_cert.py

      # TLS (P1): the reachability + auth gate over the ENCRYPTED listener — the
      # same ping-200 / no-token-401 / token-200 triad CLAUDE.md §4 protects, but
      # TLS-wrapped via the exact production seam (ssl.wrap_socket the listener,
      # the hand-rolled Handler serves unchanged). Plus /api/tls/cert (enabled ->
      # 200+PEM, disabled -> 404) and the decisive control: the advertised fp
      # equals the fingerprint of the cert the server actually presents.
      - name: Unit tests (TLS reachability smoke)
        run: python3 tests/test_tls_smoke.py

      # TLS (P2): availability is advertised on the three pre-auth surfaces a
      # TLS-aware app can reach (GET /api/ping, the UDP discovery reply, the
      # pairing QR). The load-bearing assertion is the additive control — when TLS
      # is dark the bytes are exactly today's, and when enabled the tls_* fields
      # are the ONLY difference — so an old app keeps working (CLAUDE.md §4).
      - name: Unit tests (TLS availability advertisement)
        run: python3 tests/test_tls_advertise.py

      # TLS (P5): short-lived tickets let the un-pinnable native <Image> loader +
      # streamed uploader avoid putting the bearer token on the wire on a TLS box.
      # The load-bearing invariants: mint is bearer-gated, a ticket authorizes only
      # image GETs (never a control route like /api/status), and a single-use upload
      # ticket is burned on first use so a sniffed URL can't be replayed.
      - name: Unit tests (TLS tickets)
        run: python3 tests/test_tls_ticket.py

      # Pairing PIN full-screen launch resolver. A desktop-session box is a system
      # service with a partial env, so a bare xdg-open failed and the PIN never
      # showed (a hard stop for pairing). Pins the browser->--kiosk argv mapping
      # (flatpak vs system browser, known browsers only, url passed verbatim).
      - name: Unit tests (pairing PIN kiosk launch)
        run: python3 tests/test_pair_kiosk.py

      # Game-mode (gamescope / Big Picture) pointer input: the {t:'gm'} verb.
      # The portal is absent in Game Mode, so absolute menu nav rides an xdotool
      # ARGV LIST. Same security class as {t:'ma'}: holder gate + range-validated
      # coords + a looked-up button (the client string never reaches argv) +
      # degrade-closed when xdotool / a live gamescope session is missing.
      - name: Unit tests (game-mode pointer input)
        run: python3 tests/test_gamemode_input.py

      # Who is OFFERED Couch Mode. The gate used to grep /etc/os-release for
      # "steamos"/"bazzite", so a CachyOS deckify box with every tool, both
      # sessions and a connected panel was refused by its NAME — hiding the
      # toggle, the desktop cluster and the guide hold together. Now it probes
      # the tools plus both switch targets; these pin both directions.
      - name: Unit tests (couch mode gate)
        run: python3 tests/test_couchmode_gate.py

      # Which OS the Console header claims the box runs. The shape differs by
      # distro and the reader must not assume one: a ROLLING release (CachyOS)
      # has no VERSION_ID at all, a point release (Bazzite/SteamOS) has both.
      # Fixtures are verbatim from real boxes.
      - name: Unit tests (os-release reader)
        run: python3 tests/test_os_release.py

      # Flatpak update completion (KI-036). "Done" must be the update PROCESS
      # finishing, not `remote-ls` count reaching zero — an EOL runtime pins the
      # count above zero forever, which stranded the card on "Updating…" and
      # blocked the OS step behind it. Device-confirmed 2026-07-27.
      - name: Unit tests (flatpak update completion)
        run: python3 tests/test_flatpak_completion.py

      # Stream-host liveness (the `online` field). remoteclients.vdf lists every
      # host ever streamed from and says nothing about which are ON, so picking a
      # game from a sleeping PC makes Steam offer a multi-GB install instead.
      # Detection joins on the 64-bit Steam CLIENT ID (a box keeps it across a
      # rename) and reads a STATE out of Steam's own remote-connections log --
      # beacon recency alone was measured unusable (median gap 9s but p99 2725s).
      # Fixtures are relative to now; a dated fixture plus an age cap is a time
      # bomb, which this repo has already paid for once.
      - name: Unit tests (stream host liveness)
        run: python3 tests/test_stream_online.py

      # TV identification. A user aimed pairing at an LG COMMERCIAL signage
      # panel the scan had offered, and got "_ssl.c:1063: The handshake
      # operation timed out" -- a raw socket error that says nothing about the
      # real problem. Measured: the panel opens 3001 in 6ms and never
      # handshakes, while opening 9761; a consumer set completes TLSv1.3 and
      # refuses 9761. So an open port is NOT an identification, and the
      # commercial check must precede the consumer one because both open 3001.
      - name: Unit tests (tv identify)
        run: python3 tests/test_tv_identify.py

      # Config load. _parse_config() returns a POSITIONAL tuple that
      # load_config() unpacks, so a new optional section must be threaded
      # through both ends -- miss either and the agent crash-loops on startup
      # with a NameError. That shipped to a real box and was missed by
      # py_compile (syntax only), by importing the module (load_config is never
      # reached), and by starting with an EMPTY config (invalid input takes the
      # defaults path and returns BEFORE the unpack). Only a config with real
      # content exercises it.
      - name: Unit tests (config load)
        run: python3 tests/test_config_load.py

      # Three-way protocol parity. The Linux agent, the Windows agent and the
      # app each carry their own copy of the wire vocabulary, and "added to one
      # end, not the other" is this repo's most repeated defect -- a config
      # section that reached _parse_config but not load_config's unpack
      # crash-looped a live box, and the smart-TV backends existed on Linux for
      # weeks before Windows. protocol/protocol.json is the authority; this
      # drives both agents' REAL decoders (their internal tables legitimately
      # differ -- uinput vs ViGEm) and reads the app's literal TS unions, in
      # BOTH directions.
      - name: Unit tests (protocol parity)
        run: python3 tests/test_protocol_parity.py

      # Config SAVES must land beside the config, not in the process CWD. The
      # temp-file dir came from `dirname(CONFIG_PATH) or "."`, and mkstemp
      # returns an ABSOLUTE path -- so "." followed the CWD, which for a systemd
      # service is "/". A relative --config therefore wrote to the root
      # filesystem; on SteamOS that is read-only, and pairing a TV on a Steam
      # Deck died with "[Errno 30] Read-only file system:
      # '/.couchside-config-il0oed3c'". Reproducing it needs no read-only mount:
      # the defect is following the CWD at all. Covers BOTH agents -- Windows
      # shipped the identical block, where the stray CWD is System32.
      - name: Unit tests (config write)
        run: python3 tests/test_config_write.py
      # Decky detection. install.sh gated co-existence on `[ -d ~/homebrew/plugins ]`,
      # but Decky's OWN uninstaller removes the unit and services/PluginLoader and
      # LEAVES that directory behind -- so a box that had uninstalled Decky still
      # tested as having it, left couchside.service DORMANT, and handed the agent
      # to a plugin that could never load. Net result: no running agent. The test
      # extracts the real function from install.sh so it fails on drift.
      - name: Unit tests (decky detection)
        run: bash tests/test_decky_detect.sh

      # Restarting plugin_loader restarts DECKY ITSELF, reloading every OTHER
      # plugin the user has. install.sh used to do that on every agent update,
      # even when our panel was byte-identical (KI-037) — which is how an
      # unrelated plugin's memory growth came to look like our update caused it.
      # Both directions are asserted: an always-skip guard would silently stop
      # shipping plugin updates, which is worse than the bug it fixes.
      - name: Unit tests (decky restart guard)
        run: bash tests/test_decky_restart_guard.sh

      # Gaming card (/api/gaming): the card* glob trap (a cardN-DP-1 connector
      # dir must not be read as a GPU), the reaper AppId matcher incl. the
      # [oom_reaper] reject, the empty-power_supply desktop case + the uniq (never
      # phys) battery join, and per-field probe-and-appear. Drives the real
      # functions against sysfs/proc fixtures via the module-constant roots.
      - name: Unit tests (gaming card)
        run: python3 tests/test_gaming_card.py

      # Display + audio readout. This feature is almost entirely probes, and
      # almost every source on a Linux box answers "what CAN this display do"
      # while the Console tab claims to show "what IS it doing" — so the tests
      # that matter are the ones proving a capability never ships as a state:
      # EDID's preferred timing and gamescopectl's ValidRefreshRates never
      # become the current mode, and /sys/.../modes (a LIST, with no refresh
      # rate in it at all) never does either. Plus the two measured lies:
      # kscreen-doctor SIGABRTs with rc=134 and zero output, which must read as
      # "unavailable" and not as "no displays"; and GAMESCOPE_DISPLAY_HDR_ENABLED
      # reads 1 on a box whose panel reports no HDR, because it is Steam's
      # REQUEST rather than state. Fixtures are verbatim hardware captures.
      - name: Unit tests (display + audio readout)
        run: python3 tests/test_display_audio.py

      # The on-box pairing page: both loopback gates (peer IP + Host header,
      # anti-DNS-rebinding — a box's token must never leave its own screen), the
      # idle tutorial + its reload-into-PIN handoff, the PIN state machine
      # (attempt cap / expiry / single-use, previously untested — KI-020), and
      # the KI-019 box-pop throttle. The renders + handoff were also proven on a
      # real box's CEF; this guards the logic a refactor could quietly break.
      - name: Unit tests (pairing page)
        run: python3 tests/test_pair_page.py

      # The on-box UPDATE progress page. It polls /api/ping across the agent's
      # own restart. SUCCESS (version changed) is the ONE state that stops the
      # poll; unreachable == restarting and reachable-but-unchanged == still
      # installing are BOTH non-terminal — they escalate wording and, after a
      # generous wait, a SOFT recovery hint, but NEVER declare failure and never
      # stop watching. That is the fix for two real boxes: one that span forever
      # on a stalled install (Legion Go S), and one that FALSELY said "didn't
      # finish" on a slow-but-successful restart (SteamOS Steam Machine). The
      # test executes the pure updDecide() under node to observe both states.
      - name: Unit tests (update page)
        run: python3 tests/test_update_page.py

      # The app-triggered-update sudo grant + detached fast-path (§3). A phone
      # update on a system-service box stalled because the detached installer
      # could not restart the service without a password. The fix adds ONE
      # NOPASSWD grant — so its SHAPE is pinned here: exactly-argument (fixed unit
      # + --no-block, no wildcard that could restart any unit), and the fast-path
      # is gated (existing install, not Decky) and exits BEFORE the general-root
      # setup it cannot do. A grant in the sudo path is where §3 bites hardest.
      - name: Unit tests (update grant)
        run: python3 tests/test_update_grant.py

      # The flatpak slice of the update hub. Asserts the SECURITY SHAPE (§3):
      # the update functions take zero client-reachable arguments, the elevated
      # argv is exactly the fixed root-owned wrapper (never raw flatpak, whose
      # subcommands include install/run), the installer's wrapper ignores its
      # argv, the opt-in grant names the wrapper path only, and the elevation
      # probe degrades closed. Mutation-checked (probe pointed at raw flatpak
      # fails). Live counterpart proven on a real box: root wrapper bypasses the
      # polkit denial that blocks the sessionless agent's own flatpak update.
      - name: Unit tests (flatpak update)
        run: python3 tests/test_flatpak_update.py

      # The OS-update slice: same security shape as flatpak (no client id, frozen
      # argv, wrapper-gated grant) plus the atomic-update HONESTY — os_status
      # reads the STAGED state back so the app says "reboot to apply", never
      # reports a staged image as done. Mutation-relevant: the installer wrapper
      # validates its mode to check|apply and never forwards argv. Live
      # counterpart proven on Bazzite: read-only check + a no-op apply ran as
      # root via the wrapper, staged nothing, and GET reported the real version.
      - name: Unit tests (OS update)
        run: python3 tests/test_os_update.py

      # Stream-host detection (/api/stream-host, phase 4a — detect only). The
      # fixtures are verbatim /proc/net lines off a live box, so they encode the
      # real trap: an ESTABLISHED TCP peer on 27036 is the ROUTER, not a session,
      # and a client's connection outlives its stream. Detection is log-driven
      # (both edges + names the client), cross-checked against the data port
      # (udp/27031) so a host that dies WITHOUT writing its stop marker does not
      # leave the card advertising a dead session for 12 hours.
      - name: Unit tests (stream host)
        run: python3 tests/test_stream_host.py

      # Screen capture backend selection. couchside.service and the Steam
      # session race at boot: measured on a real box, the agent came up 34
      # seconds BEFORE the gamescope socket existed, cached "desktop/spectacle"
      # for its whole uptime, and fired a KDE screenshot tool at a gamescope
      # session -- every frame 503 until someone restarted the service. These
      # drive the socket set CHANGING after startup, which is the only shape
      # that catches it; a test that merely checks a correct startup passes
      # against the bug.
      - name: Unit tests (screen capture)
        run: python3 tests/test_screen_capture.py

      # Couchside Player tile. Three things, each of which has a measured bug
      # behind it: the service allowlist (the conf the tile reads is written
      # from a client request, so an id that is not a case arm must launch
      # NOTHING); the display backend, which is the INVERSE between Game Mode
      # (DISPLAY=:1, no WAYLAND_DISPLAY) and a desktop spawned from a
      # non-graphical parent, and is asserted in both directions because one
      # direction is not a measurement; and the _ss_appid anchor collision --
      # the screensaver finds its own shortcut by searching shortcuts.vdf for
      # "couchside/Couchside", which a player installed one directory over
      # would also match, silently breaking the screensaver on any box with
      # both. That one carries a positive control so "found nothing" cannot
      # pass for "parser works".
      - name: Unit tests (player tile)
        run: python3 tests/test_player_tile.py

      # Player routes. Drives a real Handler on loopback with STUB steam /
      # steamos-add-to-steam binaries that log every call, so "refused" and
      # "nothing ran" are two separate observations -- a test that only checked
      # the status code would pass against an agent that 404s the caller while
      # still launching the tile. Also pins the `player` cap at all five edit
      # sites; miss the app three and the cap never persists, so the tab
      # re-probes forever.
      - name: Unit tests (player API + caps)
        run: python3 tests/test_player_api.py

      # Player transport over CDP. Runtime.evaluate runs arbitrary JS in a
      # browser signed into the user's streaming accounts, so the whole design
      # is lookup-only: an op id selects a script CONSTANT, and a numeric
      # argument is taken out of a frozen tuple by index rather than formatted
      # from the request. These replace _pl_cdp_run with a spy and assert that
      # every script that would execute is one of those constants, and that a
      # refused request leaves the spy untouched -- "returned 404" and
      # "executed nothing" are separate observations.
      - name: Unit tests (player transport)
        run: python3 tests/test_player_transport.py

      # The installer's decision about the Couchside Player add-on, run against
      # the REAL gate lines lifted out of install.sh rather than a copy. The
      # policy is preserve-never-opt-in: an experimental add-on must not arrive
      # on every piped `curl | bash`, and an unattended update must not rip it
      # off a box that chose it. Both directions are asserted.
      - name: Installer add-on policy (player)
        run: bash tests/test_installer_player.sh install.sh

      # Distro neutrality (the CachyOS/Arch pass). The installer's two
      # distro-aware spots — firewall backend, python3 hint — must stay
      # capability-probed, never distro-named, and a firewall is only touched
      # when it is RUNNING. Pins are textual: what lands on boxes is this text.
      - name: Installer distro-neutrality pins
        run: bash tests/test_installer_distro.sh install.sh

      # The installer's security-page-facing surface: the KI-022 token
      # redaction in the closing banner, `couchside new-token` (revocation),
      # `couchside tls on|off|status`, and the firewall opening the TLS
      # listener port (a ufw box that advertises a blocked 8788 strands a
      # pinned app, which fails closed by design). Mutation-checked pins.
      - name: Installer CLI + token-redaction pins
        run: bash tests/test_installer_cli.sh install.sh

      # Injected actions: buttons the agent offers only when the box can really
      # perform them ("a dead button costs more trust than a missing one"), so
      # every gate is asserted in BOTH directions. Covers the Bluetooth pairing
      # deep link, whose URL is NOT a literal in Steam's JS bundle — grepping
      # for it proves nothing, which is how an earlier pass wrongly concluded no
      # such deep link existed. Also pins idempotency and config-wins.
      - name: Unit tests (injected actions)
        run: python3 tests/test_actions_inject.py

      # Steam settings deep links (/api/steam/menus). The slug list CANNOT be
      # derived from Steam's JS bundle (routes are built from the panel name, so
      # no slug is a literal in it) and a WRONG slug is silently non-fatal —
      # Steam just opens its default page — so a bad entry ships as a button
      # that works and goes somewhere else. Every slug was confirmed by screen-
      # capturing a real box; this gate pins that the ones measured ABSENT stay
      # absent, and that the id never reaches a shell.
      - name: Unit tests (steam settings menus)
        run: python3 tests/test_steam_menus.py

      # Two invariants, one guard (history in the test's own docstring):
      # 1. The shipping camera is QR-PAIRING ONLY and MIC-LESS. expo-camera became
      #    legitimate 2026-07-27 (the in-app pairing scanner, PR #292) -- but its
      #    plugin defaults add RECORD_AUDIO + an iOS mic string, so the pins
      #    (recordAudioAndroid/microphonePermission false) are enforced here.
      # 2. Branch feat/demo-mode stays UNMERGEABLE (rear-camera PiP promo tool,
      #    ad-hoc bundle-id fork). Its own isolation test is useless as a merge
      #    guard -- merging the branch merges its approval -- so the guard lives
      #    HERE. Autolinking keys off package.json (measured), which is why the
      #    dependency and plugin must arrive together or not at all.
      - name: Unit tests (camera is pairing-only + mic-less; demo mode unmergeable)
        run: python3 tests/test_no_camera_in_shipping_app.py

      # Windows non-Steam launchers (Epic / GOG / Xbox). These take a client id,
      # so the load-bearing gate is allowlist-by-lookup: the id is matched in a
      # fresh read-only discovery and the argv is REBUILT from the record, never
      # interpolated. Pins the reject path (unknown/malformed id -> None, nothing
      # runs) and that the `launchers` capability is wired at all five edit sites.
      - name: Unit tests (Windows game launchers)
        run: python3 tests/test_win_launchers.py

      # The agent's own log rides the watchlist as a pseudo-unit so it reaches
      # the Logs picker; `sc query` can only ever say it does not exist, which
      # showed as a permanent yellow warning on a real Windows box. Pins the
      # log_only flag AND that real services are never flagged.
      - name: Unit tests (Windows log-only pseudo-unit)
        run: python3 tests/test_win_log_unit.py

      # Per-game playtime out of Steam's localconfig.vdf, which is what lets the
      # app answer "never played" with no network and no Steam API key. The
      # load-bearing control: a "Playtime" key in the FRIENDS block must never be
      # attributed to a game.
      - name: Unit tests (Steam playtime parsing)
        run: python3 tests/test_steam_playtime.py

      # ---------------------------------------------------------------------
      # The eight suites below were written, committed, and then never wired
      # into CI — so they have never once gated a push. Found 2026-08-01 by
      # diffing tests/test_*.py against this file. Three of them are the
      # security-shaped suites CLAUDE.md §6 requires for a route that takes
      # client input, which means the guard existed and was not guarding.
      # If you add a tests/test_*.py, add its step here in the same commit.
      # ---------------------------------------------------------------------

      # POST /api/upload — the §6 checklist for a route taking a client-supplied
      # name: happy path, auth failure, and traversal/subdir/empty rejection.
      # Runs against a REAL loopback server because the route streams the body
      # straight to disk ahead of the generic in-memory cap; a faked rfile would
      # prove nothing about the containment path that actually ships.
      - name: Unit tests (upload auth + path containment)
        run: python3 tests/test_upload.py

      # steam_goto() — `steam://` can install games and run programs, so the
      # destination is looked up in a frozen dict and the URL chosen in the
      # agent, never supplied by the caller. The refusal cases are the point of
      # the file.
      - name: Unit tests (steam goto is allowlisted)
        run: python3 tests/test_steam_goto.py

      # stop_running_game() — the security shape IS the feature: it takes NO
      # argument, so a client that cannot name a process cannot be steered into
      # killing one. The first assertion is the signature itself, because the
      # refactor that "helpfully" adds a pid is what turns a close-my-game
      # button into a remote kill-anything primitive, and it looks like a
      # convenience at review time.
      - name: Unit tests (game stop takes no client argument)
        run: python3 tests/test_game_stop.py

      # Big Picture — Couch Mode's degraded tier. Pins that the cap is EXCLUSIVE
      # with couchmode (a Deck must never be offered the lesser tier), that a
      # non-allowlisted op runs nothing (asserted on a spawn counter), and that
      # closing with no Steam running is SUCCESS, not an error.
      - name: Unit tests (big picture tier)
        run: python3 tests/test_bigpicture.py

      # The box's OWN battery. Fixtures verbatim from a Legion Go S: BAT0's
      # uevent repeats POWER_SUPPLY_TYPE, so a one-occurrence-per-key parser
      # passes by luck rather than design. Both ENERGY- and CHARGE-based gauges
      # are exercised.
      - name: Unit tests (box battery)
        run: python3 tests/test_box_battery.py

      # PSI memory pressure. A used-percentage says what is spoken for, not what
      # is hurting — a handheld reads 26% while a game stutters. Fixtures only:
      # inducing real memory stall on a live box risks OOM-killing Steam.
      - name: Unit tests (memory pressure parsing)
        run: python3 tests/test_mem_pressure.py

      # Steam cover art. The resolver looked only for library_600x900.jpg and
      # left 30 of 80 installed games showing a blank text card while the real
      # capsule sat one directory deeper under a content-hash subdirectory.
      - name: Unit tests (steam cover art)
        run: python3 tests/test_steam_cover_art.py

      # Install a game you own but have not downloaded. Adds a NEW client-supplied
      # -appid path (install:<appid>), so these tests assert the allowlist rules:
      # installed games are NOT installable (control), tools/non-digit dirs are
      # excluded, an unowned appid is refused with nothing run, the argv is the
      # agent's constant + a digits-only appid, and the enumeration degrades closed.
      - name: Unit tests (steam install — owned-but-uninstalled)
        run: python3 tests/test_steam_install.py

      # Setup -> Utilities (Stage 1: read-only detection). A new surface that will
      # grow state-changing tenants, so the tests pin the §3 properties up front:
      # the tenant set is FROZEN (built from _UTILITY_IDS, never client input), the
      # OpenPuck flash target needs a known label AND the UF2 marker (a mislabelled
      # stick is refused — the control), detection degrades closed, and the route is
      # behind the bearer gate.
      - name: Unit tests (utilities detection)
        run: python3 tests/test_utilities.py

      # _unreadable_reason() — why a controller cannot be read. The app used to
      # tell every affected user to re-run install.sh, which on a Legion Go S
      # cannot work: a POSIX ACL grants the user, and mode 000 collapses the
      # mask that would make the grant effective. Sending someone to do
      # something that cannot work is worse than saying nothing.
      - name: Unit tests (controller unreadable reason)
        run: python3 tests/test_guide_unreadable_reason.py

      # The guard for the class of bug above: a suite in tests/ that no workflow
      # runs is now itself a CI failure, in both directions (orphaned file, and
      # a step pointing at a file that no longer exists).
      - name: Unit tests (every suite in tests/ actually runs in CI)
        run: python3 tests/test_ci_wiring.py

      # The README's security section must name every root grant install.sh
      # writes. It claimed "exactly six" while the installer wrote nine, and the
      # three it missed included two root-owned FILE WRITES. That section is the
      # document someone reads before running `curl … | bash` on the machine
      # holding their game library, so its accuracy is a build gate, not a
      # docs chore.
      - name: Unit tests (README documents every root grant)
        run: python3 tests/test_readme_sudo_grants.py

      # The Play release-notes script now READS ITS OWN WORK BACK instead of
      # trusting the :commit call's 200 — the shape that once published a stale
      # changelog and exited 0. The three outcomes must stay distinct: match
      # succeeds, mismatch hard-fails, unreadable only warns (the notes are
      # already live by then). No network — the API layer is stubbed, and so is
      # `cryptography`, which the runner does not install.
      - name: Unit tests (play release notes are verified after commit)
        run: python3 tests/test_play_release_notes.py

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      # The ONLY automated check the drag-stroke geometry can have. React Native
      # Web emits mouse events, never touch events, so onTouchMove never fires
      # in the web harness and the trail path cannot be driven there at all --
      # which is how a version that drew nothing on a real iPhone passed every
      # pre-ship check. Node runs the .ts directly via type stripping; no build.
      - name: Unit tests (touch drag stroke geometry)
        run: node --experimental-strip-types app/__tests__/touch-trail.ts

      # The mobile-app update decision (couchside.tv/app-version.json vs the
      # running build). Pure logic — iOS marketing-version compare, Android
      # versionCode compare, degrade-closed on anything missing. The component
      # needs a device; this is the risk (component-wise version compare, the
      # 2.9.9 < 2.9.21 trap, never a false "update available").
      - name: Unit tests (app update check)
        run: node --experimental-strip-types app/__tests__/app-update.ts

      # KI-002: the app had NO automated signal of any kind. Every escaped bug
      # this project has paid for lately was in app/ -- a tap shipped broken to
      # TestFlight, a link that overflowed only on Android, a button occluded
      # only on a handheld -- while CI ran 25 Python steps for the agent and
      # zero for the app. A typecheck is not a test, but it is the cheapest
      # thing that fails on a push that does not compile, which is currently
      # nobody's job but the author's memory.
      - name: Install app deps
        run: npm ci --prefix app --no-audit --no-fund
      - name: Typecheck the app
        run: npx --prefix app tsc --noEmit -p app

  smoke:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Boot the agent headless with --mock (never touches uinput/hardware/CEC),
      # a throwaway literal token, and a minimal valid config on a spare port.
      # Then hit an AUTHED endpoint (/api/status) with the token and assert
      # 200 + JSON. /api/ping is public by design (pre-auth), so we also verify a
      # no-token request to /api/status is rejected (401) to prove the auth gate.
      - name: Boot agent (mock) and probe authed endpoint
        run: |
          set -euo pipefail
          PORT=8791
          TOKEN="ci-smoke-$RANDOM$RANDOM"
          CFG="$RUNNER_TEMP/couchside-ci-config.json"
          cat > "$CFG" <<'JSON'
          {
            "units": [{"name": "sshd.service", "scope": "system"}],
            "actions": {}
          }
          JSON

          python3 agent/couchsided.py \
            --mock --host 127.0.0.1 --port "$PORT" \
            --token "$TOKEN" --config "$CFG" \
            > "$RUNNER_TEMP/agent.log" 2>&1 &
          AGENT_PID=$!
          # Always dump the log and reap the agent, even on failure.
          trap 'echo "----- agent.log -----"; cat "$RUNNER_TEMP/agent.log" || true; kill "$AGENT_PID" 2>/dev/null || true' EXIT

          # Wait for the socket to bind (best-effort boot; ~9s budget).
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$PORT/api/ping" >/dev/null 2>&1; then
              echo "agent bound after $i tries"
              break
            fi
            if ! kill -0 "$AGENT_PID" 2>/dev/null; then
              echo "agent process exited during boot" >&2
              exit 1
            fi
            sleep 0.3
          done

          # Public pre-auth endpoint must be 200.
          PING_CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/api/ping")
          echo "GET /api/ping -> $PING_CODE"
          [ "$PING_CODE" = "200" ] || { echo "expected /api/ping 200, got $PING_CODE" >&2; exit 1; }

          # No token -> the authed endpoint must reject (proves the gate is live).
          NOAUTH_CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/api/status")
          echo "GET /api/status (no token) -> $NOAUTH_CODE"
          [ "$NOAUTH_CODE" = "401" ] || { echo "expected /api/status 401 without token, got $NOAUTH_CODE" >&2; exit 1; }

          # With token -> 200 and a JSON body.
          BODY="$RUNNER_TEMP/status.json"
          AUTH_CODE=$(curl -s -o "$BODY" -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:$PORT/api/status")
          echo "GET /api/status (token) -> $AUTH_CODE"
          [ "$AUTH_CODE" = "200" ] || { echo "expected /api/status 200 with token, got $AUTH_CODE" >&2; exit 1; }
          python3 -c "import json,sys; json.load(open('$BODY')); print('authed body is valid JSON')"

          # The guide-hold route must be served and authed like any other. In
          # --mock it answers 200 with a synthetic controller list; on a real box
          # it 404s when the handoff or evdev is unavailable, which is how the
          # app decides whether to show the row at all.
          GBODY="$RUNNER_TEMP/guide.json"
          GUIDE_CODE=$(curl -s -o "$GBODY" -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:$PORT/api/guide-hold")
          echo "GET /api/guide-hold (token) -> $GUIDE_CODE"
          [ "$GUIDE_CODE" = "200" ] || { echo "expected /api/guide-hold 200 in mock, got $GUIDE_CODE" >&2; exit 1; }
          python3 - "$GBODY" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          # Must ship OFF by default: a false trigger destroys unsaved desktop work.
          assert d["enabled"] is False, "guide-hold must default to disabled"
          assert isinstance(d["controllers"], list), "controllers must be a list"
          print("guide-hold body OK (enabled=%s)" % d["enabled"])
          PY

          echo "smoke OK"

  # App-side WebSocket input-path lifecycle (CLAUDE.md §4 — the most bug-prone
  # code in the project). lib/gamepad.ts is runtime-import-free (only a global
  # WebSocket + Date/timers), so the lifecycle test runs standalone on Node's
  # built-in type stripping + test runner: no npm install, no Metro, no bundler.
  # Guards the "green pill, dead mouse, force-quit to recover" zombie —
  # connect()/ensureLive() must never leave a torn-down socket behind over a
  # stale 'connected' status.
  app-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # --test-timeout, NOT --test-force-exit. Force-exit was here because a
      # FAILING test throws before its client.close(), leaking the 5s ping
      # setInterval and hanging the job. It fixed that but SILENTLY TRUNCATED THE
      # RUN: measured 2026-07-26, three consecutive invocations reported 56, 51
      # and 48 tests against 60 without the flag. Force-exit races the reporter,
      # so CI could skip a failing test and still go green — on the input path,
      # of all places. A per-test timeout kills a hang just as dead while letting
      # every test actually run.
      - name: Input-path unit tests (gamepad lifecycle + trackpad gestures)
        run: node --experimental-strip-types --test --test-timeout=60000 lib/__tests__/*.test.ts hooks/__tests__/*.test.ts
        working-directory: app
      # The TV crypto (cert minting + SHA-256) genuinely NEEDS node-forge, so it
      # cannot live in the install-free glob above — a tested module that imports
      # a real dependency is exactly the trap CONVENTIONS warns about, and it went
      # green locally (forge installed) while CI could not resolve the package.
      # It runs in its own directory (lib/tvdirect/__tests__), so the fast step
      # stays import-free; here we install ONLY node-forge (pure JS, no deps) and
      # run it. Verifies the cert modulus against openssl, which the runner has.
      - name: TV crypto unit tests (node-forge; cert mint + sha256 vs Node/openssl)
        run: |
          npm install node-forge@1.3.1 --no-save --no-package-lock --no-audit --no-fund
          node --experimental-strip-types --test --test-timeout=120000 lib/tvdirect/__tests__/*.test.ts
        working-directory: app
