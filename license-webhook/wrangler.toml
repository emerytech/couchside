name = "couchside-license-webhook"
main = "worker.js"
compatibility_date = "2026-09-01"

# Non-secret config. Secrets (below) are set with `wrangler secret put`, never here.
[vars]
FROM_EMAIL = "Couchside <licenses@couchside.tv>"
# LS_VARIANT_ID = ""   # optional: only issue for the Couchside Direct variant id

# Optional but recommended — KV for idempotency (dedupe issued orders so a
# re-delivered webhook doesn't re-email). Create it, then uncomment + paste the id:
#   wrangler kv namespace create ISSUED
# [[kv_namespaces]]
# binding = "ISSUED"
# id = "PASTE_KV_ID"

# --- Secrets (set once, never committed) ---
#   wrangler secret put LICENSE_PRIVATE_KEY_PKCS8_B64   # base64 of the PKCS#8 DER of the license key
#   wrangler secret put LS_WEBHOOK_SECRET               # the Lemon Squeezy webhook signing secret
#   wrangler secret put RESEND_API_KEY                  # Resend API key
